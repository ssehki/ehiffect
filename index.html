<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ehiffect — book your appointment</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --pink:#E38AAE;
    --pink-deep:#C97A9B;
    --pink-soft: rgba(227,138,174,0.12);
    --cream:#F4EAE5;
    --muted:#A6969A;
    --line: rgba(227,138,174,0.30);
    --bg:#171214;
    --panel:#1F1719;
    --panel-2:#251C1F;
  }

  .theme-light{
    --pink-soft: rgba(227,138,174,0.10);
    --cream:#211A1B;
    --muted:#8C7B7E;
    --line: rgba(184,92,130,0.30);
    --bg:#F8F3EF;
    --panel:#FFFFFF;
    --panel-2:#FFFFFF;
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0;padding:0;background:var(--bg); color:var(--cream); font-family:'Work Sans', sans-serif; min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased; }
  #app{ background:transparent; min-height:100vh; min-height:100dvh; }
  .wrap{ max-width:480px; margin:0 auto; padding:36px 20px 80px; background:var(--bg); min-height:100vh; min-height:100dvh; }

  .logo-block{ text-align:center; margin-bottom:6px; }
  .logo-img{ width:150px; height:auto; margin:0 auto; display:block; }
  .logo-img.small{ width:100px; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4)); }

  .hero{
    background:transparent;
    margin: 0 0 30px;
    padding: 10px 10px 6px;
    text-align:center;
    position:relative;
  }
  .hero .logo-img{ width:150px; position:relative; z-index:1; }
  .hero-divider{ display:none; }

  h1.title{ text-align:center; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:30px; line-height:1.2; margin: 18px 0 14px; color:var(--cream); position:relative; z-index:1; letter-spacing:0.01em; }
  .tagline{ text-align:center; color:var(--muted); font-size:14.5px; line-height:1.7; font-family:'Work Sans', sans-serif; margin: 0 auto; max-width:340px; position:relative; z-index:1; }
  .eyebrow{ text-align:center; text-transform:uppercase; letter-spacing:0.28em; font-size:11px; color:var(--pink); font-weight:600; margin:0 0 14px; position:relative; z-index:1; }

  .cta-btn{
    display:block; width:100%; text-align:center;
    background:var(--pink); color:#241318; border:none; border-radius:2px;
    padding:16px 20px; margin-bottom:14px; cursor:pointer;
    font-family:'Work Sans', sans-serif; font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.14em;
    transition: background .15s, transform .15s;
  }
  .cta-btn:hover{ background:var(--cream); }
  .cta-btn.secondary{ background:transparent; color:var(--cream); border:1px solid var(--line); }
  .cta-btn.secondary:hover{ border-color:var(--pink); background:var(--pink-soft); }

  .landing-choice{
    background:var(--panel); border:1px solid var(--line); border-radius:2px;
    padding:26px 22px; margin-bottom:14px; cursor:pointer;
    transition: border-color .15s, background .15s;
  }
  .landing-choice:hover{ border-color:var(--pink); background:var(--panel-2); }
  .landing-choice-title{ font-family:'Cormorant Garamond', serif; font-size:23px; font-weight:600; color:var(--cream); margin-bottom:5px; }
  .landing-choice-title::after{ content:' →'; color:var(--pink); }
  .landing-choice-sub{ font-size:12.5px; color:var(--muted); }
  .back-link{ font-size:12px; color:var(--pink); cursor:pointer; margin-bottom:14px; display:inline-block; letter-spacing:0.03em; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:22px 20px; }
  .card + .card{ margin-top:16px; }

  .step-label{ display:flex; align-items:baseline; gap:8px; margin-bottom:14px; }
  .step-num{ font-family:'Cormorant Garamond', serif; font-variant-numeric: lining-nums; font-size:26px; color:var(--pink); font-weight:600; line-height:1; }
  .step-title{ font-family:'Cormorant Garamond', serif; font-size:20px; font-weight:600; color:var(--cream); }

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cat{ border:1px solid var(--line); border-radius:2px; padding:14px 10px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; color:var(--cream); }
  .cat:hover{ border-color:var(--pink); }
  .cat.selected{ background:var(--pink); border-color:var(--pink); }
  .cat.selected .cat-name{ color:#241318; }
  .cat-name{ font-size:13.5px; font-weight:500; }
  .cat-wide{ grid-column: 1 / -1; padding:16px 10px; }

  .opt-group{ display:flex; flex-direction:column; gap:8px; }
  .opt{ display:flex; justify-content:space-between; align-items:center; border:1px solid var(--line); border-radius:2px; padding:12px 14px; cursor:pointer; background:transparent; transition:border-color .15s, background .15s; color:var(--cream); }
  .opt:hover{ border-color:var(--pink); }
  .opt.selected{ background:var(--pink); border-color:var(--pink); }
  .opt.selected .opt-name, .opt.selected .opt-sub, .opt.selected .opt-price{ color:#241318; }
  .opt-name{ font-size:14.5px; font-weight:500; }
  .opt-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .opt-price{ font-size:14px; color:var(--pink); font-weight:600; white-space:nowrap; margin-left:10px;}

  .length-row{ display:flex; gap:8px; margin-top:10px; padding-left:2px; flex-wrap:wrap; }
  .length-btn{ flex:1; min-width:120px; text-align:center; font-size:12.5px; padding:8px 4px; border:1px solid var(--line); border-radius:2px; background:transparent; color:var(--cream); cursor:pointer; }
  .length-btn.selected{ background:var(--pink); color:#241318; border-color:var(--pink); }

  .bundle-row{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-left:2px; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{ width:28px; height:28px; border:1px solid var(--pink); background:transparent; color:var(--pink); font-size:16px; cursor:pointer; line-height:1; }
  .stepper button:disabled{ opacity:0.35; cursor:not-allowed; }
  .stepper span{ min-width:16px; text-align:center; font-weight:600; color:var(--cream); }

  .addon-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line); font-size:14px; color:var(--cream); }
  .addon-row:last-child{ border-bottom:none; }
  .addon-row label{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .addon-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--pink); }
  .addon-note{ font-size:11px; color:var(--muted); margin:2px 0 6px 26px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; }
  .field input, .field textarea, .field select{ width:100%; border:1px solid var(--line); border-radius:2px; background:var(--panel-2); padding:11px 12px; font-family:'Work Sans', sans-serif; font-size:14.5px; color:var(--cream); }
  .field input::placeholder, .field textarea::placeholder{ color:#6B5C60; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:2px solid var(--pink); outline-offset:1px; }
  .field textarea{ resize:vertical; min-height:64px; }
  .avail-note{ font-size:12px; color:var(--pink); margin-top:6px; background:var(--pink-soft); padding:8px 10px; }

  .total-bar{ display:flex; justify-content:space-between; align-items:baseline; padding:16px 2px 2px; border-top:1px solid var(--line); margin-top:16px; }
  .total-bar .label{ font-size:13px; color:var(--muted); }
  .total-bar .amount{ font-family:'Cormorant Garamond', serif; font-variant-numeric: lining-nums; font-size:28px; color:var(--pink); font-weight:600; }

  .deposit-note{ background:var(--pink-soft); border-left:3px solid var(--pink); padding:12px 14px; font-size:13px; line-height:1.5; margin-top:18px; color:var(--cream); }
  .deposit-note b{ color:var(--pink); }

  .psa{ background:#0F0C0D; color:var(--cream); padding:14px 16px; font-size:13px; line-height:1.6; margin-top:18px; border-left:3px solid var(--pink); }
  .psa b{ color:var(--pink); }

  .policy-box{ border:1px solid var(--line); padding:12px 14px; margin-top:14px; font-size:12.5px; color:var(--muted); line-height:1.6; }
  .policy-box b{ color:var(--cream); }
  .agree-row{ display:flex; align-items:flex-start; gap:10px; margin-top:14px; }
  .agree-row input{ width:17px; height:17px; margin-top:2px; accent-color:var(--pink); flex-shrink:0; }
  .agree-row label{ font-size:12.5px; color:var(--cream); line-height:1.5; }

  .photo-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .photo-thumb{ position:relative; width:64px; height:64px; }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; border:1px solid var(--line); }
  .photo-thumb .rm{ position:absolute; top:-6px; right:-6px; background:var(--pink); color:#241318; width:18px; height:18px; border-radius:50%; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .photo-add{ width:64px; height:64px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--pink); cursor:pointer; }

  .submit-btn{ width:100%; background:var(--pink); color:#241318; border:none; border-radius:2px; padding:16px; font-family:'Work Sans', sans-serif; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.12em; cursor:pointer; margin-top:18px; }
  .submit-btn:hover{ background:var(--cream); }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .error-text{ color:var(--pink); font-size:12.5px; margin-top:8px; }
  .footer-note{ text-align:center; color:var(--muted); font-size:11.5px; margin-top:26px; line-height:1.6; }

  .confirm{ text-align:center; padding:50px 10px; }
  .confirm svg{ width:52px; height:52px; margin-bottom:16px; }
  .confirm h2{ font-family:'Cormorant Garamond', serif; font-size:28px; margin:0 0 10px; color:var(--cream); }
  .confirm p{ color:var(--muted); font-size:14px; line-height:1.6; max-width:340px; margin:0 auto 8px; }
  .confirm .cashtag{ color:var(--pink); font-weight:600; }
  .confirm button{ margin-top:20px; background:none; border:1px solid var(--pink); color:var(--pink); padding:10px 20px; font-size:13px; cursor:pointer; }

  .admin-wrap{ max-width:640px; }
  .gate{ max-width:340px; margin:80px auto; text-align:center; }
  .gate input{ width:100%; padding:12px; border:1px solid var(--line); background:var(--panel-2); color:var(--cream); text-align:center; letter-spacing:0.2em; font-size:16px; margin-top:16px; }
  .gate button{ margin-top:14px; width:100%; padding:12px; background:var(--pink); color:#241318; border:none; cursor:pointer; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; font-size:13px; }
  .gate .err{ color:var(--pink); font-size:12.5px; margin-top:10px; }

  .booking-card{ background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:16px 18px; margin-bottom:12px; }
  .booking-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .booking-name{ font-family:'Cormorant Garamond', serif; font-size:20px; font-weight:600; color:var(--cream); }
  .booking-meta{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .status-pill{ font-size:11px; padding:4px 10px; border-radius:20px; white-space:nowrap; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; }
  .status-pending{ background:#5c4a14; color:#f5e3b3; }
  .status-approved{ background:#2f5c2b; color:#c9e3c6; }
  .status-denied{ background:#5c2f2f; color:#e9c9c9; }
  .status-no-show{ background:#3d2f5c; color:#d6c9f0; }
  .repeat-flag{ display:inline-block; background:#7a2f2f; color:#fff; font-size:10px; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .booking-detail{ font-size:13.5px; margin-top:10px; line-height:1.7; color:var(--cream); }
  .booking-detail .k{ color:var(--muted); }
  .booking-photos{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .booking-photos img{ width:56px; height:56px; object-fit:cover; border:1px solid var(--line); cursor:pointer; }
  .booking-actions{ display:flex; gap:8px; margin-top:12px; }
  .booking-actions button{ flex:1; padding:9px; font-size:12.5px; border:1px solid var(--line); background:transparent; color:var(--cream); cursor:pointer; }
  .booking-actions button.approve{ border-color:#5fa858; color:#8fd487; }
  .booking-actions button.deny{ border-color:#c9716f; color:#e39997; }
  .booking-actions button.active{ color:#fff; }
  .booking-actions button.approve.active{ background:#2f5c2b; }
  .booking-actions button.deny.active{ background:#7a2f2f; }
  .booking-actions button.pending.active{ background:#7a5c14; color:#fff; border-color:#7a5c14; }

  .empty{ text-align:center; color:var(--muted); padding:60px 20px; font-size:14px; }
  .admin-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .refresh-btn{ background:none; border:1px solid var(--line); padding:7px 12px; font-size:12px; cursor:pointer; color:var(--muted); }
  .loading{ text-align:center; color:var(--muted); padding:40px; font-size:13px; }
</style>
</head>

function getThanksgivingDate(year){
  const d = new Date(year, 10, 1); // Nov 1
  const dow = d.getDay();
  const firstThursday = 1 + ((4 - dow + 7) % 7);
  return new Date(year, 10, firstThursday + 21);
}
function isThanksgivingWeek(dateStr){
  if(!dateStr) return false;
  const d = new Date(dateStr + 'T12:00:00');
  const tg = getThanksgivingDate(d.getFullYear());
  const weekStart = new Date(tg); weekStart.setDate(tg.getDate() - tg.getDay());
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
  return d >= weekStart && d <= weekEnd;
}
function isCampusCutieDay(dateStr){
  if(!dateStr) return false;
  const day = new Date(dateStr + 'T12:00:00').getDay();
  return day === 0 || day === 3; // Sunday or Wednesday
}

function timeToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function getDayBounds(dateStr){
  if(!dateStr) return null;
  const day = new Date(dateStr + 'T12:00:00').getDay();
  const windows = WEEKDAY_WINDOWS[day];
  if(!windows) return null;
  const starts = windows.map(w=>w.start), ends = windows.map(w=>w.end);
  return { min: starts.sort()[0], max: ends.sort().slice(-1)[0] };
}
function isTimeAllowed(dateStr, timeStr){
  if(!dateStr || !timeStr) return true; // nothing to check yet
  const day = new Date(dateStr + 'T12:00:00').getDay();
  const windows = WEEKDAY_WINDOWS[day];
  if(!windows) return true; // flexible day
  const t = timeToMinutes(timeStr);
  return windows.some(w => t >= timeToMinutes(w.start) && t <= timeToMinutes(w.end));
}

function money(n){ return (n===null || n===undefined) ? "Quote pending" : "$" + n.toFixed(0); }
function displayTotal(t){
  if(t===null || t===undefined || t==='') return "Quote pending";
  if(typeof t === 'number') return money(t);
  const n = Number(t);
  return isNaN(n) ? String(t) : money(n);
}

async function saveBooking(data){
  // no-cors: we don't need to read Google's response back, just confirm the
  // request went out. Trying to read a cross-origin response from Apps Script
  // is what was throwing "something went wrong" even when the save succeeded.
  await fetch(CONFIG.apiUrl, {
    method:"POST",
    mode:"no-cors",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action:"create" }, data))
  });
  return true;
}
async function listBookings(){
  const res = await fetch(CONFIG.apiUrl + "?action=list");
  const json = await res.json();
  const bookings = json.bookings || [];
  bookings.sort((a,b)=> (b.submittedAt||0) - (a.submittedAt||0));
  return bookings;
}
async function updateStatus(key, status){
  await fetch(CONFIG.apiUrl, {
    method:"POST",
    mode:"no-cors",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"updateStatus", key, status })
  });
}

function fileToCompressedDataURL(file, maxW=700, quality=0.65){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============== pricing calc ============== */
function currentTier(){
  if(!state.category || !(state.category in INSTALLS) || !state.tierKey) return null;
  return INSTALLS[state.category].tiers.find(t=>t.key===state.tierKey);
}
function serviceChosen(){
  if(state.category==='qw' || state.category==='si') return !!state.tierKey;
  if(state.category==='braids') return !!(state.braidStyle && state.braidSize && state.ownHair);
  if(state.category==='cornrows') return !!state.cornrowKey;
  if(state.category==='crochet') return !!state.crochetHairSource;
  if(state.category==='treatments') return Object.values(state.treatmentKeys).some(Boolean);
  if(state.category==='bundles') return true;
  return false;
}
function calcTotal(){
  let total = 0;
  if(state.category==='qw' || state.category==='si'){
    const tier = currentTier();
    if(tier){
      total += tier.price;
      if(tier.addBundle && state.addBundleCount>0 && state.length) total += tier.addBundle[state.length] * state.addBundleCount;
      if(state.style === 'fulani') total += FULANI_SURCHARGE[state.category];
      for(const a of INSTALL_ADDONS){ if(state.addons[a.key]) total += a.price; }
    }
  } else if(state.category==='braids'){
    const size = BRAID_SIZES.find(s=>s.key===state.braidSize);
    if(size) total += size.price;
    if(state.braidBoho) total += BOHO_PRICE;
  } else if(state.category==='cornrows'){
    const c = CORNROW_OPTIONS.find(c=>c.key===state.cornrowKey);
    if(c) total += c.price;
  } else if(state.category==='crochet'){
    if(state.crochetHairSource) total += CROCHET_PRICES[state.crochetHairSource];
  } else if(state.category==='treatments'){
    if(state.treatmentGroupSize > 1 && GROUP_TREATMENT_PRICES[state.treatmentGroupSize]){
      total = GROUP_TREATMENT_PRICES[state.treatmentGroupSize];
    } else {
      for(const t of TREATMENTS){ if(state.treatmentKeys[t.key]) total += t.price; }
    }
  } else if(state.category==='bundles'){
    total = null; // priced after catalog/quote, not a fixed number
  }

  // deals only apply to services that aren't bundles or treatments (treatments has its own group rate above)
  if(total !== null && state.category !== 'bundles' && state.category !== 'treatments'){
    if(state.dealsSelected.length){
      state.dealsSelected.forEach(dk=>{
        const deal = DEALS.find(d=>d.key===dk);
        if(!deal) return;
        if(deal.key==='btc' && !state.btcFirstConfirmed) return; // not confirmed yet, no discount
        if(deal.key==='campuscutie' && !isCampusCutieDay(state.date)) return; // wrong day, no discount
        if(deal.key==='loyalty' && state.loyaltyVisit !== '5th') return; // only the 5th install qualifies
        if(deal.type==='flat') total -= deal.value;
        else if(deal.type==='percent') total -= total * (deal.value/100);
        else if(deal.type==='freeAddon' && (state.category==='qw'||state.category==='si') && state.addons.curls){
          const curlsAddon = INSTALL_ADDONS.find(a=>a.key==='curls');
          if(curlsAddon) total -= curlsAddon.price;
        }
      });
    }
    // Thanksgiving week discount is automatic, doesn't count toward the 2-deal max
    if(isThanksgivingWeek(state.date)){
      total -= total * 0.15;
    }
    total = Math.max(0, total);
  }
  return total;
}
function serviceLabelText(){
  const dealDetails = [];
  state.dealsSelected.forEach(dk=>{
    const deal = DEALS.find(d=>d.key===dk);
    if(!deal) return;
    let line = deal.name;
    if(dk==='bestie') line += ` (bestie: ${state.bestieInfo||'not given'})`;
    if(dk==='loyalty') line += ` (client says: ${state.loyaltyVisit||'not specified'} install)`;
    if(dk==='btc') line += ` (first appt of semester confirmed: ${state.btcFirstConfirmed?'yes':'no'})`;
    if(dk==='campuscutie') line += isCampusCutieDay(state.date) ? ' (date matches Wed/Sun)' : ' (date does NOT match Wed/Sun — verify)';
    dealDetails.push(line);
  });
  if(isThanksgivingWeek(state.date)) dealDetails.push('Thanksgiving week (auto 15% off)');
  const dealSuffix = dealDetails.length ? ` [deals: ${dealDetails.join('; ')}]` : '';

  if(state.category==='qw' || state.category==='si'){
    const tier = currentTier(); if(!tier) return '';
    let s = `${INSTALLS[state.category].label} — ${tier.name}`;
    if(state.installTexture) s += `, texture: ${state.installTexture}`;
    if(state.style === 'fulani') s += ` (Fulani styling)`;
    if(state.length) s += `, +${state.addBundleCount} bundle(s) @ ${state.length}`;
    return s + dealSuffix;
  }
  if(state.category==='braids') return `${BRAID_STYLES[state.braidStyle]||''} — ${state.braidSize||''} (${state.ownHair==='own'?'client has own hair':'needs hair provided'})${state.braidBoho ? ' + boho pieces' : ''}` + dealSuffix;
  if(state.category==='cornrows'){ const c = CORNROW_OPTIONS.find(c=>c.key===state.cornrowKey); return (c ? `Cornrows — ${c.name}` : '') + dealSuffix; }
  if(state.category==='crochet') return `Crochet (no leave-out) — ${state.crochetHairSource==='own'?'client has own hair':'stylist providing hair'} — details: ${state.crochetDetails}` + dealSuffix;
  if(state.category==='treatments'){
    let s = TREATMENTS.filter(t=>state.treatmentKeys[t.key]).map(t=>t.name).join(' + ');
    if(state.treatmentGroupSize > 1) s += ` [group of ${state.treatmentGroupSize}: ${state.treatmentGroupNames||'names not given'}]`;
    return s;
  }
  if(state.category==='bundles') return `Bundle purchase only — qty ${state.bundleQty}, texture: ${state.bundleTexture||'not specified'} — ${state.bundleDetails}`;
  return '';
}

      <div class="field"><label>Name</label><input type="text" id="f-name" value="${state.name}" placeholder="your name"/></div>
      <div class="field"><label>Phone number</label><input type="tel" id="f-phone" value="${state.phone}" placeholder="so I can confirm your appt"/></div>
      <div class="field"><label>Instagram (optional)</label><input type="text" id="f-ig" value="${state.ig}" placeholder="@yourhandle"/></div>
      ${state.category==='bundles' ? `
      <div class="field">
        <label>Preferred pickup date</label>
        <input type="date" id="f-date" value="${state.date}"/>
      </div>` : ''}
      <div class="field"><label>Anything else?</label><textarea id="f-notes" placeholder="details, requests, etc.">${state.notes}</textarea></div>

      <div class="field">
        <label>Reference photos (optional, up to 3)</label>
        <div class="photo-row">
          ${state.photos.map((p,i)=>`<div class="photo-thumb"><img src="${p}"/><div class="rm" data-action="remove-photo" data-key="${i}">×</div></div>`).join('')}
          ${state.photos.length < 3 ? `<div class="photo-add" id="photo-add-btn">+</div>` : ''}
        </div>
        <input type="file" id="photo-input" accept="image/*" multiple style="display:none;"/>
      </div>

      <div class="psa"><b>Please come with hair freshly washed and blow-dried.</b> Appointments with hair that isn't washed/stretched may be turned away or take longer, and may be charged extra.</div>
      <div class="policy-box"><b>Policy:</b> ${CONFIG.policyText}</div>

      <div class="deposit-note">
        Your appointment isn't confirmed until a <b>${money(CONFIG.depositAmount)} deposit</b> is sent to <b class="cashtag">${CONFIG.cashtag}</b> on Cash App. Once I see it, I'll text you to lock in your time. Deposit comes off your total at your appointment.
      </div>

      <div class="agree-row">
        <input type="checkbox" id="agree-policy" ${state.agreedPolicy?'checked':''} data-action="toggle-agree"/>
        <label for="agree-policy">I understand the wash/blow-dry requirement and the cancellation policy above.</label>
      </div>

      ${state.error ? `<div class="error-text">${state.error}</div>` : ''}
      <button class="submit-btn" data-action="submit">Send Booking Request</button>
    </div>` : ''}

    <div class="footer-note">up to 2 deals per booking, confirmed at approval<br/>bloomington · dm @ehiffect with any questions</div>
  </div>`;
}

function renderConfirm(){
  return `<div class="wrap"><div class="confirm">${checkSVG}<h2>Request sent!</h2>
  <p>I've got your details. Send your <b>${money(CONFIG.depositAmount)}</b> deposit to <span class="cashtag">${CONFIG.cashtag}</span> to hold your spot — I'll text you to confirm your exact time within 24 hours.</p>
  <button data-action="book-again">Book another</button></div></div>`;
}

function renderGate(){
  return `<div class="wrap admin-wrap"><div class="gate">
  <div class="logo-block"><img class="logo-img small" src="data:image/png;base64,${LOGO_B64}" alt="The Ehiffect"/></div>
  <h1 class="title" style="font-size:22px;">Dashboard</h1>
  <input type="password" id="admin-pass" placeholder="passcode" value="${state.adminInput}"/>
  <button data-action="admin-login">Enter</button>
  ${state.adminError ? `<div class="err">${state.adminError}</div>` : ''}
  </div></div>`;
}

function renderAdmin(){
  if(state.loadingAdmin){
    return `<div class="wrap admin-wrap"><div class="loading">Loading bookings…</div></div>`;
  }
  const filtered = state.filter === 'all' ? state.bookings : state.bookings.filter(b=>b.status===state.filter);
  const noShowCounts = {};
  state.bookings.forEach(b=>{ if(b.status==='no-show' && b.phone){ noShowCounts[b.phone] = (noShowCounts[b.phone]||0)+1; } });
  return `<div class="wrap admin-wrap">
    <div class="admin-header">
      <img class="logo-img small" src="data:image/png;base64,${LOGO_B64}" alt="The Ehiffect"/>
      <button class="refresh-btn" data-action="refresh">refresh</button>
    </div>
    <div class="cat-grid" style="grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:18px;">
      ${['all','pending','approved','denied','no-show'].map(f=>`<div class="cat ${state.filter===f?'selected':''}" data-action="filter" data-key="${f}"><span class="cat-name" style="text-transform:capitalize;">${f}</span></div>`).join('')}
    </div>
    ${filtered.length===0 ? `<div class="empty">No bookings here yet.</div>` : filtered.map(b=>`
      <div class="booking-card">
        <div class="booking-top">
          <div><div class="booking-name">${b.name || 'no name'}${(noShowCounts[b.phone]||0) >= 2 ? `<span class="repeat-flag">repeat no-show</span>` : ''}</div><div class="booking-meta">${b.phone || ''} ${b.ig ? '· ' + b.ig : ''}</div></div>
          <span class="status-pill status-${b.status}">${b.status}</span>
        </div>
        <div class="booking-detail">
          <div><span class="k">Service:</span> ${b.serviceLabel}</div>
          <div><span class="k">Preferred:</span> ${b.date || '—'} ${b.time || ''}</div>
          <div><span class="k">Total:</span> ${displayTotal(b.total)}</div>
          ${b.notes ? `<div><span class="k">Notes:</span> ${b.notes}</div>` : ''}
          <div><span class="k">Submitted:</span> ${b.submittedAt ? new Date(Number(b.submittedAt)).toLocaleString() : ''}</div>
        </div>
        ${b.photos && b.photos.length ? `<div class="booking-photos">${b.photos.map(p=>`<img src="${p}" data-action="view-photo" data-src="${p}"/>`).join('')}</div>` : ''}
        <div class="booking-actions">
          <button class="approve ${b.status==='approved'?'active':''}" data-action="set-status" data-key="${b.key}" data-status="approved">Approve</button>
          <button class="pending ${b.status==='pending'?'active':''}" data-action="set-status" data-key="${b.key}" data-status="pending">Pending</button>
          <button class="deny ${b.status==='denied'?'active':''}" data-action="set-status" data-key="${b.key}" data-status="denied">Deny</button>
          <button class="deny ${b.status==='no-show'?'active':''}" data-action="set-status" data-key="${b.key}" data-status="no-show">No-show</button>
        </div>
      </div>`).join('')}
  </div>`;
}

/* ============== event handling ============== */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.getAttribute('data-action');
    const evt = (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type==='checkbox')) ? 'change' : 'click';
    el.addEventListener(evt, async (e)=>{
      const key = el.getAttribute('data-key');

      if(action==='landing-pick'){
        resetSelection();
        state.view = 'book';
        if(key === 'bundles'){ state.category = 'bundles'; state.hideCategoryGrid = true; }
        else { state.category = null; state.hideCategoryGrid = false; }
      }
      else if(action==='go-landing'){ state.view = 'landing'; }
      else if(action==='switch-to-service'){ resetSelection(); state.category = null; state.hideCategoryGrid = false; }
      else if(action==='pick-category'){ state.category = key; resetSelection(); }
      else if(action==='toggle-deal'){
        const idx = state.dealsSelected.indexOf(key);
        if(idx >= 0){ state.dealsSelected.splice(idx,1); }
        else if(state.dealsSelected.length < MAX_DEALS){ state.dealsSelected.push(key); }
      }
      else if(action==='pick-style'){ state.style = key; }
      else if(action==='pick-tier'){ state.tierKey = key; state.length=null; state.addBundleCount=0; state.installTexture=""; state.error=''; }
      else if(action==='pick-install-texture'){ state.installTexture = el.value; }
      else if(action==='pick-length'){ state.length = key; state.addBundleCount = state.addBundleCount || 1; }
      else if(action==='bundle-plus'){ state.addBundleCount++; }
      else if(action==='bundle-minus'){ state.addBundleCount = Math.max(0,state.addBundleCount-1); }
      else if(action==='toggle-addon'){ state.addons[key] = !state.addons[key]; }
      else if(action==='pick-braid-style'){ state.braidStyle = key; state.braidSize=null; state.ownHair=null; state.braidBoho=false; }
      else if(action==='pick-braid-size'){ state.braidSize = key; }
      else if(action==='pick-own-hair'){ state.ownHair = key; }
      else if(action==='toggle-boho'){ state.braidBoho = !state.braidBoho; }
      else if(action==='pick-cornrow'){ state.cornrowKey = key; }
      else if(action==='toggle-treatment'){ state.treatmentKeys[key] = !state.treatmentKeys[key]; }
      else if(action==='pick-crochet-source'){ state.crochetHairSource = key; }
      else if(action==='pick-group-size'){ state.treatmentGroupSize = parseInt(key); }
      else if(action==='pick-loyalty-visit'){ state.loyaltyVisit = el.value; }
      else if(action==='toggle-btc-confirm'){ state.btcFirstConfirmed = !state.btcFirstConfirmed; }
      else if(action==='toggle-crochet-confirm'){ state.crochetConfirmed = !state.crochetConfirmed; }
      else if(action==='qty-plus'){ state.bundleQty++; }
      else if(action==='qty-minus'){ state.bundleQty = Math.max(1, state.bundleQty-1); }
      else if(action==='pick-bundle-texture'){ state.bundleTexture = el.value; }
      else if(action==='toggle-agree'){ state.agreedPolicy = !state.agreedPolicy; }
      else if(action==='remove-photo'){ state.photos.splice(parseInt(key),1); }
      else if(action==='view-photo'){ window.open(el.getAttribute('data-src'), '_blank'); return; }
      else if(action==='submit'){
        state.name = document.getElementById('f-name').value.trim();
        state.phone = document.getElementById('f-phone').value.trim();
        state.ig = document.getElementById('f-ig').value.trim();
        state.date = document.getElementById('f-date').value;
        const timeEl = document.getElementById('f-time');
        state.time = timeEl ? timeEl.value : '';
        state.notes = document.getElementById('f-notes').value.trim();
        const bestieEl = document.getElementById('f-bestie-info');
        if(bestieEl) state.bestieInfo = bestieEl.value.trim();
        const groupNamesEl = document.getElementById('f-group-names');
        if(groupNamesEl) state.treatmentGroupNames = groupNamesEl.value.trim();

        if(!state.name || !state.phone){ state.error = "Please add your name and phone number so I can confirm your appt."; render(); return; }
        if(state.category !== 'bundles' && state.date && state.time && !isTimeAllowed(state.date, state.time)){
          const dayNoteNow = AVAILABILITY[new Date(state.date + 'T12:00:00').getDay()];
          state.error = `That time isn't available on this date. ${dayNoteNow}`; render(); return;
        }
        if(!state.agreedPolicy){ state.error = "Please check the box confirming you've read the wash/blow-dry and cancellation policy."; render(); return; }
        if(state.category==='crochet'){
          state.crochetDetails = document.getElementById('f-crochet-details').value.trim();
          if(!state.crochetHairSource || !state.crochetConfirmed){ state.error = "Please pick who's providing the hair and confirm you'll send hair details."; render(); return; }
          if(!state.crochetDetails){ state.error = "Please tell me about the crochet style you want (pattern, length, color, etc)."; render(); return; }
        }
        if(state.category==='bundles'){
          state.bundleDetails = document.getElementById('f-bundle-details').value.trim();
          if(!state.bundleDetails){ state.error = "Please describe the type/brand/length of bundles you want."; render(); return; }
        }
        if(state.category==='treatments' && state.treatmentGroupSize > 1){
          const chosenCount = TREATMENTS.filter(t=>state.treatmentKeys[t.key]).length;
          if(chosenCount !== 1){ state.error = "For a group booking, please select exactly one service that everyone will get."; render(); return; }
          if(!state.treatmentGroupNames){ state.error = "Please add your bestie(s) name/IG so I can match your bookings."; render(); return; }
        }
        if(state.dealsSelected.includes('bestie') && !state.bestieInfo){ state.error = "Please add your bestie's name/IG for the Bestie Bonus deal."; render(); return; }

        const rawTotal = calcTotal();
        const booking = {
          name: state.name, phone: state.phone, ig: state.ig, date: state.date, time: state.time, notes: state.notes,
          photos: state.photos, serviceLabel: serviceLabelText(), total: (rawTotal===null ? "Quote pending" : rawTotal)
        };
        el.disabled = true; el.textContent = "Sending...";
        try{ await saveBooking(booking); state.view = 'confirm'; }
        catch(err){ state.error = "Something went wrong — try again in a moment."; el.disabled=false; el.textContent="Send Booking Request"; }
      }
      else if(action==='book-again'){
        const bookings = state.bookings;
        state = { view:"landing", category:null, hideCategoryGrid:false, style:"traditional", tierKey:null, length:null, addBundleCount:0, addons:{}, braidStyle:null, braidSize:null, ownHair:null, braidBoho:false, cornrowKey:null, treatmentKeys:{}, crochetHairSource:null, crochetConfirmed:false, crochetDetails:"", bundleQty:1, bundleDetails:"", bundleTexture:"", installTexture:"", dealsSelected:[], bestieInfo:"", loyaltyVisit:"", btcFirstConfirmed:false, treatmentGroupSize:1, treatmentGroupNames:"", name:"",phone:"",ig:"",date:"",time:"",notes:"", photos:[], agreedPolicy:false, error:"", bookings, adminInput:"", adminError:"", filter:"all", loadingAdmin:false };
      }
      else if(action==='admin-login'){
        const val = document.getElementById('admin-pass').value;
        if(val === CONFIG.adminPasscode){
          state.view = 'admin'; state.adminError=''; state.loadingAdmin = true;
          render();
          try{ state.bookings = await listBookings(); }catch(err){ state.bookings = []; }
          state.loadingAdmin = false;
        } else { state.adminError = "wrong passcode"; }
      }
      else if(action==='refresh'){
        state.loadingAdmin = true; render();
        try{ state.bookings = await listBookings(); }catch(err){ state.bookings = []; }
        state.loadingAdmin = false;
      }
      else if(action==='filter'){ state.filter = key; }
      else if(action==='set-status'){
        const status = el.getAttribute('data-status');
        await updateStatus(key, status);
        try{ state.bookings = await listBookings(); }catch(err){}
      }
      render();
    });
  });

  const passInput = document.getElementById('admin-pass');
  if(passInput) passInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') document.querySelector('[data-action="admin-login"]').click(); });

  const dateInput = document.getElementById('f-date');
  if(dateInput) dateInput.addEventListener('change', (e)=>{ state.date = e.target.value; render(); });
  const timeInput = document.getElementById('f-time');
  if(timeInput) timeInput.addEventListener('change', (e)=>{ state.time = e.target.value; render(); });

  // keep text/textarea fields synced live so a re-render triggered by another
  // control (checkbox, select, date/time) never wipes what's already been typed
  const liveFieldMap = {
    'f-name':'name', 'f-phone':'phone', 'f-ig':'ig', 'f-notes':'notes',
    'f-bundle-details':'bundleDetails', 'f-crochet-details':'crochetDetails',
    'f-bestie-info':'bestieInfo', 'f-group-names':'treatmentGroupNames'
  };
  Object.entries(liveFieldMap).forEach(([id, key])=>{
    const el2 = document.getElementById(id);
    if(el2) el2.addEventListener('input', (e)=>{ state[key] = e.target.value; });
  });

  const photoAddBtn = document.getElementById('photo-add-btn');
  const photoInput = document.getElementById('photo-input');
  if(photoAddBtn && photoInput){
    photoAddBtn.addEventListener('click', ()=> photoInput.click());
    photoInput.addEventListener('change', async (e)=>{
      const files = Array.from(e.target.files).slice(0, 3 - state.photos.length);
      for(const f of files){
        try{ const dataUrl = await fileToCompressedDataURL(f); state.photos.push(dataUrl); }catch(err){}
      }
      photoInput.value = '';
      render();
    });
  }
}

/* ============== router ============== */
function checkRoute(){ if(window.location.hash === '#admin'){ state.view = (state.view==='admin') ? 'admin' : 'admin-gate'; } }
window.addEventListener('hashchange', ()=>{ checkRoute(); render(); });
checkRoute();
render();
</script>
</body>
</html>
