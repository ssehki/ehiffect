const pct = x => (isFinite(x) ? Math.round(x * 100) : 0) + "%";
const ceil5 = n => Math.ceil(n / 5) * 5;
const parseMoney = v => { const t = String(v === undefined || v === null ? "" : v).replace(/[$,\s]/g, ""); if(t === "") return null; const n = Number(t); return isNaN(n) || n < 0 ? NaN : n; };
const cfgOf = () => (S.data && S.data.config) || { prices:{}, deals:[], hours:{}, saleEnds:"", latest:"", rebookEmails:true };
const needsNewScript = () => !!(S.outdated || (S.data && !S.stale && (S.data.version || 0) < ADMIN_NEEDS_VERSION));

/* ---------- profit report + price predictor ---------- */
function serviceGroup(b){ return (svcName(b).split(" — ")[0] || "Other").replace(/\s+/g, " ").trim() || "Other"; }

function reportRange(){
  const now = new Date(), ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const p = S.rpPeriod || "month";
  if(p === "month"){
    const ym = S.month || (now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0"));
    const [y, m] = ym.split("-").map(Number);
    return { from: ym + "-01", to: ymd(new Date(y, m, 0)), months: 1, label: new Date(y, m - 1, 1).toLocaleDateString(undefined, { month:"long", year:"numeric" }) };
  }
  if(p === "3" || p === "12"){
    const k = Number(p), start = new Date(now.getFullYear(), now.getMonth() - (k - 1), 1);
    return { from: ymd(start), to: ymd(now), months: k, label: "the last " + k + " months" };
  }
  const dates = S.data.bookings.filter(b => b.serviced && b.dateIso).map(b => b.dateIso).sort();
  if(!dates.length) return { from: "9999", to: "0000", months: 1, label: "all time" };
  const a = isoToDate(dates[0]), z = isoToDate(dates[dates.length - 1]);
  return { from: dates[0], to: dates[dates.length - 1], months: Math.max(1, (z.getFullYear() - a.getFullYear()) * 12 + z.getMonth() - a.getMonth() + 1), label: "all time" };
}

function reportBody(){
  const R = reportRange();
  const rows = S.data.bookings.filter(b => b.serviced && b.dateIso && b.dateIso >= R.from && b.dateIso <= R.to);
  if(!rows.length) return `<p class="hint" style="margin:12px 0 0;">No finished appointments in ${esc(R.label)} yet. Tap <b>Wrap up</b> on an appointment and enter what was paid, the tip, and what you spent on hair — then this fills in.</p>`;
  const G = {};
  rows.forEach(b => {
    const g = serviceGroup(b), o = G[g] || (G[g] = { g, n:0, rev:0, tip:0, cost:0, costN:0 });
    o.n++; o.rev += paidOf(b); o.tip += num(b.tip) || 0;
    const c = num(b.hairCost); if(c !== null){ o.cost += c; o.costN++; }
  });
  const list = Object.values(G).sort((a, b) => (b.rev + b.tip - b.cost) - (a.rev + a.tip - a.cost));
  const T = list.reduce((t, o) => ({ n:t.n + o.n, rev:t.rev + o.rev, tip:t.tip + o.tip, cost:t.cost + o.cost, costN:t.costN + o.costN }), { n:0, rev:0, tip:0, cost:0, costN:0 });
  const take = T.rev + T.tip, profit = take - T.cost;
  const target = Math.min(90, Math.max(10, Number(S.rpTarget) || 60)) / 100;
  const up = (Number(S.rpUp) || 0) / 100, vol = (Number(S.rpVol) || 0) / 100;
  const projected = (T.rev * (1 + up) + T.tip - T.cost) * (1 + vol);
  const months = R.months, per = x => money(x / months);
  const breakEven = (T.rev * (1 + up) + T.tip - T.cost) > 0 && profit > 0 ? Math.max(0, 1 - profit / (T.rev * (1 + up) + T.tip - T.cost)) : 0;
  const costCoverage = T.n ? T.costN / T.n : 1;

  const svcRows = list.map(o => {
    const avgRev = o.rev / o.n, avgTip = o.tip / o.n, avgCost = o.costN ? o.cost / o.costN : null;
    const prof = avgRev + avgTip - (avgCost || 0), margin = (avgRev + avgTip) > 0 ? prof / (avgRev + avgTip) : 0;
    let advice = "";
    if(o.n >= 2 && avgCost !== null){
      const need = avgCost / (1 - target) - avgTip;                // average price that would hit the target margin
      const gap = need - avgRev;
      advice = gap > 1 ? `To reach ${Math.round(target * 100)}% margin, charge about <b>${money(ceil5(need))}</b> on average (+${money(ceil5(gap))}, +${pct(gap / avgRev)}).` : `✓ Already at or above your ${Math.round(target * 100)}% margin goal.`;
    }else if(avgCost === null){ advice = "Enter your hair cost on these appointments to see the margin."; }
    else advice = "Need 2+ finished appointments for a suggestion.";
    const tag = avgCost === null ? '<span class="tag">no hair cost yet</span>' : (margin < target - 0.05 ? '<span class="tag bad">low margin</span>' : (margin >= target ? '<span class="tag good">healthy</span>' : '<span class="tag warn">close</span>'));
    return `<div class="row" style="cursor:default; align-items:flex-start;">
      <div class="row-main">
        <div class="row-title">${esc(o.g)} ${tag}</div>
        <div class="row-sub">${o.n} appt${o.n === 1 ? "" : "s"} · avg price ${money(avgRev)} · hair ${avgCost === null ? "—" : money(avgCost)} · profit per appt <b>${money(prof)}</b> · margin <b>${avgCost === null ? "—" : pct(margin)}</b></div>
        <div class="row-note">${advice}</div>
      </div></div>`;
  }).join("");

  const chip = (field, v, label) => `<button class="btn ${Number(S[field] || 0) === v ? 'primary' : ''}" data-a="rp-set" data-f="${field}" data-v="${v}" style="padding:7px 11px;">${label}</button>`;
  return `
    <div class="stat-grid" style="margin-top:12px;">
      <div class="stat"><b>${money(profit)}</b><span>profit · ${esc(R.label)}</span></div>
      <div class="stat"><b>${take > 0 ? pct(profit / take) : "—"}</b><span>profit margin</span></div>
      <div class="stat"><b>${money(T.rev / T.n)}</b><span>average ticket (${T.n} appts)</span></div>
      <div class="stat"><b>${T.rev > 0 ? pct(T.cost / T.rev) : "—"}</b><span>of what you charge goes to hair</span></div>
    </div>
    ${costCoverage < 0.7 ? `<div class="box warn" style="margin-top:12px;"><div style="font-size:13.5px;">You've entered hair costs on ${T.costN} of ${T.n} appointments, so profit and margin look better than they really are. Add the missing ones in Wrap up for a true picture.</div></div>` : ''}
    <h2 class="sec" style="margin-top:20px;">By service</h2>
    <div class="list">${svcRows}</div>
    <h2 class="sec" style="margin-top:22px;">If you raise prices…</h2>
    <div class="box" style="margin-top:0;">
      <div class="field" style="margin-bottom:8px;"><label>Raise every price by</label>
        <div class="btn-row">${chip("rpUp", 0, "0%")}${chip("rpUp", 5, "+5%")}${chip("rpUp", 10, "+10%")}${chip("rpUp", 15, "+15%")}${chip("rpUp", 20, "+20%")}${chip("rpUp", 25, "+25%")}</div></div>
      <div class="field" style="margin-bottom:8px;"><label>…and you lose this share of bookings</label>
        <div class="btn-row">${chip("rpVol", 0, "none")}${chip("rpVol", -5, "5%")}${chip("rpVol", -10, "10%")}${chip("rpVol", -20, "20%")}${chip("rpVol", -30, "30%")}</div></div>
      <div class="grid2">
        <div class="field" style="margin-bottom:0;"><label>Custom raise (%)</label><input type="number" inputmode="decimal" data-rp="rpUp" value="${esc(S.rpUp || 0)}"/></div>
        <div class="field" style="margin-bottom:0;"><label>Margin you want (%)</label><input type="number" inputmode="decimal" data-rp="rpTarget" value="${esc(S.rpTarget || 60)}"/></div>
      </div>
    </div>
    <div class="box" style="margin-top:12px;">
      <div class="hint" style="margin:0 0 6px;">Same hair spend and tips, ${esc(R.label)}:</div>
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px;">
        <div><div class="hint" style="margin:0;">Now</div><div class="serif" style="font-size:26px; font-weight:600;">${money(profit)}</div><div class="hint" style="margin:0;">${per(profit)} / month</div></div>
        <div style="font-size:22px; color:var(--muted);">→</div>
        <div style="text-align:right;"><div class="hint" style="margin:0;">With the change</div><div class="serif" style="font-size:26px; font-weight:600; color:${projected >= profit ? 'var(--good)' : 'var(--bad)'};">${money(projected)}</div><div class="hint" style="margin:0;">${per(projected)} / month</div></div>
      </div>
      <div style="margin-top:10px; font-size:14px;">${projected >= profit ? "That's" : "That's"} <b style="color:${projected >= profit ? 'var(--good)' : 'var(--bad)'};">${projected >= profit ? "+" : "−"}${money(Math.abs(projected - profit))}</b> (${projected >= profit ? "+" : "−"}${money(Math.abs(projected - profit) / months)} a month).
        ${up > 0 ? `At +${Math.round(up * 100)}% you could lose up to <b>${pct(breakEven)}</b> of your bookings and still make what you make now.` : 'Pick a raise above to see how many bookings you could lose and still come out ahead.'}</div>
    </div>
    <p class="hint">This is an estimate from your finished appointments. It assumes the same mix of services; real results depend on your clients.</p>`;
}

  const per = (v, l) => `<option value="${v}" ${(S.rpPeriod || "month") === v ? "selected" : ""}>${l}</option>`;

  return { p: o.p !== undefined ? o.p : def.price, w: ("w" in o) ? (o.w || 0) : (def.was || 0), edited: o.p !== undefined || ("w" in o) };

/* ---------- deals ---------- */
function allDeals(){
  const cfg = cfgOf().deals || [], out = [];
  ((S.data && S.data.builtinDeals) || []).forEach(b => {
    const o = cfg.find(x => x.key === b.key && !x.custom) || {};
    if(o.deleted) return;
    out.push(Object.assign({}, b, o, { builtin:true }));
  });
  cfg.filter(x => x.custom).forEach(x => out.push(Object.assign({}, x)));
  return out;
}
function dealUse(key){
  let n = 0, profit = 0;
  S.data.bookings.forEach(b => { if(String(b.dealKeys || "").split(",").map(s => s.trim()).includes(key) && ["approved","pending"].includes(b.status)){ n++; } });
  return n;
}
function dealState(d){
  const t = todayIso();
  if(d.paused) return { label:"Paused", cls:"" };
  if(d.start && t < d.start) return { label:"Starts " + shortDay(d.start), cls:"warn" };
  if(d.end && t > d.end) return { label:"Ended", cls:"" };
  return { label:"Live", cls:"good" };
}
function dealSummary(d){
  if(d.builtin) return d.desc || "";
  const what = d.type === "percent" ? d.value + "% off" : d.type === "charge" ? "adds $" + d.value : "$" + d.value + " off";
  const bits = [what];
  if(d.includesKit) bits.push("free mini kit");
  if(d.categories && d.categories.length) bits.push("only " + d.categories.map(c => CAT_LABEL[c] || c).join(", "));
  if(d.start || d.end) bits.push((d.start ? shortDay(d.start) : "…") + " – " + (d.end ? shortDay(d.end) : "…"));
  if(d.oneTime) bits.push("once per client");
  return bits.join(" · ");
}
const CAT_LABEL = { qw:"Quick Weave", si:"Sew-In", braids:"Braids & Twists", cornrows:"Cornrows", crochet:"Crochet", treatments:"Treatments", takedown:"Takedowns" };
function dealsSection(){
  if(!(S.data && S.data.builtinDeals)) return `<details class="fold"><summary>🏷 Deals</summary><div><p class="hint" style="margin:0;">Update your Sheet's script (see the banner at the top) to turn this on.</p></div></details>`;
  const list = allDeals();
  const rows = list.map(d => {
    const st = dealState(d), used = dealUse(d.key);
    let money_ = "";
    if(!d.builtin && d.type === "charge" && used){ const per = (Number(d.value) || 0) - (Number(d.cost) || 0); money_ = ` · you keep about ${money(per)} each = <b>${money(per * used)}</b>`; }
    return `<div class="row" style="cursor:default; align-items:flex-start;">
      <div class="row-main">
        <div class="row-title">${esc(d.name)} <span class="tag ${st.cls}">${esc(st.label)}</span>${d.builtin ? ' <span class="tag">built-in</span>' : ''}</div>
        <div class="row-sub">${esc(dealSummary(d))}</div>
        <div class="row-note">Used on ${used} booking${used === 1 ? "" : "s"}${money_}</div>
        <div class="btn-row" style="margin-top:8px;">
          <button class="btn" data-a="deal-edit" data-k="${esc(d.key)}">Edit</button>
          <button class="btn" data-a="deal-pause" data-k="${esc(d.key)}">${d.paused ? "Turn on" : "Pause"}</button>
          <button class="btn no" data-a="deal-delete" data-k="${esc(d.key)}">Delete</button>
        </div>
      </div></div>`;
  }).join("");
  const removed = ((cfgOf().deals) || []).filter(x => x.deleted && !x.custom).length;
  return `<details class="fold" ${S.openDeals ? "open" : ""} data-keep="openDeals"><summary>🏷 Deals on your website (${list.filter(d => dealState(d).label === "Live").length} live)</summary><div>
    <p class="hint" style="margin-top:0;">Anything here shows up on your booking page under "Using a deal?" within about a minute. Clients pick up to 2.</p>
    ${list.length ? `<div class="list">${rows}</div>` : '<p class="empty">No deals yet.</p>'}
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn primary" data-a="deal-new">＋ Add a deal</button>
      <button class="btn" data-a="deal-new-nov">✨ Start from my November idea</button>
    </div>
    ${removed ? `<p class="hint">${removed} built-in deal${removed === 1 ? " is" : "s are"} removed. <a href="#" data-a="deal-restore">Bring them back</a></p>` : ''}
  </div></details>`;
}
function dealSheet(){
  const d = S.dealEdit, b = !!d.builtin;
  const cat = c => `<label class="check" style="padding:4px 0;"><input type="checkbox" data-de-cat="${c}" ${(d.categories || []).includes(c) ? "checked" : ""}/> ${esc(CAT_LABEL[c])}</label>`;
  const profit = d.type === "charge" ? (Number(d.value) || 0) - (Number(d.cost) || 0) : null;
  return `<div class="veil" data-a="close-deal" data-bg="1"><div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><div><h3>${d.isNew ? "Add a deal" : "Edit deal"}</h3><p>${b ? "Built-in deal — you can rename it, change its words, or pause it." : "Shows on your booking page automatically."}</p></div>
      <button class="icon-btn" data-a="close-deal" aria-label="Close">×</button></div>
    <div class="sheet-body">
      <div class="field"><label>Name clients see</label><input type="text" id="de-name" value="${esc(d.name || "")}" maxlength="60" placeholder="e.g. Treat Yourself"/></div>
      <div class="field"><label>Short description</label><textarea id="de-desc" maxlength="200" placeholder="e.g. A meal of your choice + a mini care kit with your appointment">${esc(d.desc || "")}</textarea></div>
      ${b ? (d.value !== undefined && d.type !== undefined ? `<div class="field"><label>Amount ($ or %, depending on the deal)</label><input type="number" inputmode="decimal" id="de-value" value="${esc(d.value)}"/></div>` : '') : `
      <div class="field"><label>What does it do?</label>
        <select id="de-type">
          <option value="flat" ${d.type === "flat" ? "selected" : ""}>Takes $ off</option>
          <option value="percent" ${d.type === "percent" ? "selected" : ""}>Takes % off</option>
          <option value="charge" ${d.type === "charge" ? "selected" : ""}>Adds a package price (+$) — like food + a kit</option>
        </select></div>
      <div class="grid2">
        <div class="field"><label id="de-value-label">${d.type === "percent" ? "Percent off" : d.type === "charge" ? "Extra they pay ($)" : "Dollars off"}</label><input type="number" inputmode="decimal" id="de-value" value="${esc(d.value === undefined ? "" : d.value)}"/></div>
        <div class="field"><label>My cost per client ($)</label><input type="number" inputmode="decimal" id="de-cost" value="${esc(d.cost === undefined ? "" : d.cost)}" placeholder="food, kit…"/></div>
      </div>
      ${profit !== null ? `<div class="box" style="margin-top:0;"><div style="font-size:13.5px;">You'd keep about <b style="color:${profit >= 0 ? 'var(--good)' : 'var(--bad)'};">${money(profit)}</b> per client from this package after your cost.</div></div>` : ''}
      <div class="field" style="margin-top:14px;"><label>Which services? <span class="hint" style="display:inline;">(none ticked = all of them)</span></label>${DEAL_CAT_ORDER.map(cat).join("")}</div>
      <div class="grid2">
        <div class="field"><label>Appointments from</label><input type="date" id="de-start" value="${esc(d.start || "")}"/></div>
        <div class="field"><label>…through</label><input type="date" id="de-end" value="${esc(d.end || "")}"/></div>
      </div>
      <label class="check"><input type="checkbox" id="de-kit" ${d.includesKit ? "checked" : ""}/> Includes a free Mini Care Kit</label>
      <label class="check"><input type="checkbox" id="de-once" ${d.oneTime ? "checked" : ""}/> Once per client (you'll get an alert if someone reuses it)</label>`}
      <label class="check"><input type="checkbox" id="de-paused" ${d.paused ? "checked" : ""}/> Paused (hidden from the website)</label>
      <button class="btn primary block" data-a="deal-save" style="margin-top:10px;">${d.isNew ? "Add deal" : "Save deal"}</button>
      ${S.dealErr ? `<p class="hint" style="color:var(--bad);">${esc(S.dealErr)}</p>` : ''}
    </div></div></div>`;
}
const DEAL_CAT_ORDER = ["si", "qw", "braids", "cornrows", "crochet", "treatments", "takedown"];

/* ---------- weekly hours ---------- */
const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
function hoursState(){
  if(S.hoursDraft) return S.hoursDraft;
  const def = (S.data && S.data.defaultHours) || {}, cur = cfgOf().hours || {}, out = {};
  for(let d = 0; d <= 6; d++){
    const v = cur[d] !== undefined ? cur[d] : def[d];
    if(v === "closed") out[d] = { mode:"closed", w:[{start:"09:00", end:"17:00"}] };
    else if(Array.isArray(v) && v.length) out[d] = { mode:"set", w:v.map(x => ({ start:x.start, end:x.end })) };
    else out[d] = { mode:"flex", w:[{start:"09:00", end:"17:00"}] };
  }
  S.hoursDraft = out; return out;
}
function hoursSection(){
  if(!(S.data && S.data.defaultHours)) return `<details class="fold"><summary>🗓 Availability</summary><div><p class="hint" style="margin:0;">Update your Sheet's script (see the banner at the top) to turn this on.</p></div></details>`;
  const H = hoursState();
  const latest = S.latestDraft !== undefined ? S.latestDraft : (cfgOf().latest || (S.data.defaultLatest || "19:00"));
  const row = d => {
    const h = H[d], w = h.w;
    return `<div class="hrow">
      <div class="hday">${DAY_NAMES[d]}</div>
      <select data-hr="${d}" data-f="mode"><option value="flex" ${h.mode === "flex" ? "selected" : ""}>Flexible all day</option><option value="set" ${h.mode === "set" ? "selected" : ""}>Set hours</option><option value="closed" ${h.mode === "closed" ? "selected" : ""}>Closed</option></select>
      ${h.mode === "set" ? `<div class="hwin">${[0, 1].map(i => w[i] ? `<span><input type="time" data-hr="${d}" data-f="start" data-i="${i}" value="${esc(w[i].start)}"/> – <input type="time" data-hr="${d}" data-f="end" data-i="${i}" value="${esc(w[i].end)}"/>${i === 1 ? ` <a href="#" data-a="hr-drop" data-k="${d}">remove</a>` : ''}</span>` : '').join("")}
        ${w.length < 2 ? `<a href="#" data-a="hr-add" data-k="${d}">+ add a second window</a>` : ''}</div>` : ''}
    </div>`;
  };
  return `<details class="fold" ${S.openHours ? "open" : ""} data-keep="openHours"><summary>🗓 Availability — weekly hours</summary><div>
    <p class="hint" style="margin-top:0;">These are the times people can pick on your booking page, each week. For one-off days (vacation, a day you're booked out) use <a href="#" data-a="go-daysoff">Days off on the Schedule tab</a>.</p>
    ${[1, 2, 3, 4, 5, 6, 0].map(row).join("")}
    <div class="field" style="margin-top:12px;"><label>Latest start time on any day</label><input type="time" id="hr-latest" value="${esc(latest)}"/></div>
    <div class="btn-row"><button class="btn primary" data-a="save-hours">Save hours</button><button class="btn" data-a="reset-hours">Back to built-in hours</button></div>
  </div></details>`;
}

async function saveConfig(partial, doneText){
  S.busy = "Saving…"; renderLayer();
  try{
    const r = await api("saveConfig", { config: partial });
    S.busy = "";
    if(r && r.ok){ S.data.config = r.config; cacheSave(); S.dealEdit = null; render(); toast(doneText || "Saved — it's live on your website in about a minute"); return true; }
    renderLayer(); toast((r && r.error) || "Didn't save — try again."); return false;
  }catch(err){ S.busy = ""; renderLayer(); failToast(err); return false; }
}
const newDealKey = () => "c_" + Math.random().toString(36).slice(2, 8);
function novemberDeal(){
  const now = new Date(), y = (now.getMonth() === 11 ? now.getFullYear() + 1 : now.getFullYear());
  return { isNew:true, key:newDealKey(), custom:true, name:"Treat Yourself", desc:"Add a meal of your choice + a mini care kit to your appointment.",
    type:"charge", value:25, cost:20, categories:[], start:y + "-11-01", end:y + "-11-30", includesKit:true, oneTime:false, paused:false };
}
function dealsToSave(){ return (cfgOf().deals || []).map(x => Object.assign({}, x)); }

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a = el.dataset.a, k = el.dataset.k;
  if(a === "retry-save"){ const r = S.retry; S.retry = null; if(r) act(r.body, r.busyText, r.doneText); else render(); return; }
  if(a === "invite-rebook"){ const b = get(k); if(!b) return; compose({ key:k, kind:"rebookInvite", title:"Invite " + first(b.name) + " to rebook", okLabel:"Send invite", doneText:"Invite sent to " + first(b.name) }); return; }
  if(a === "send-rebook"){ const b = get(k); if(!b) return; compose({ key:k, kind:"rebook", title:"Thank " + first(b.name) + " + aftercare", okLabel:"Send", doneText:"Sent to " + first(b.name) }); return; }
  if(a === "rp-set"){ S[el.dataset.f] = Number(el.dataset.v); redrawReport(); return; }
  if(a === "go-daysoff"){ e.preventDefault(); S.tab = "schedule"; S.openDaysOff = true; window.scrollTo(0, 0); render(); return; }

  /* prices */
  if(a === "save-prices"){
    const cat = S.data.catalog || [], D = S.priceDraft || {}, out = {}; let bad = null;
    cat.forEach(c => {
      const d = D[c.id] || {}, cur = (cfgOf().prices || {})[c.id] || {}, item = {};
      if(d.p !== undefined){ const v = parseMoney(d.p); if(Number.isNaN(v)){ bad = c.label; return; } if(v !== null && v !== c.price) item.p = v; }
      else if(cur.p !== undefined) item.p = cur.p;
      if(d.w !== undefined){ const v = parseMoney(d.w); if(Number.isNaN(v)){ bad = c.label; return; }
        if(v !== null){ if(v === 0){ if(c.was > 0) item.w = null; } else if(v !== c.was) item.w = v; } }
      else if("w" in cur) item.w = cur.w;
      if(Object.keys(item).length) out[c.id] = item;
    });
    if(bad){ toast("Check the number for: " + bad); return; }
    const ok = await saveConfig({ prices: out, saleEnds: S.saleDraft !== undefined ? S.saleDraft : (cfgOf().saleEnds || "") }, "Prices saved — live on your website in about a minute");
    if(ok){ S.priceDraft = null; S.saleDraft = undefined; render(); }
    return;
  }
  if(a === "reset-prices"){
    if(!confirm("Put every price back to the built-in numbers?")) return;
    const ok = await saveConfig({ prices:{}, saleEnds:"" }, "Back to the built-in prices");
    if(ok){ S.priceDraft = null; S.saleDraft = undefined; render(); }
    return;
  }

  /* deals */
  if(a === "deal-new"){ S.dealEdit = { isNew:true, key:newDealKey(), custom:true, name:"", desc:"", type:"flat", value:"", cost:"", categories:[], start:"", end:"", includesKit:false, oneTime:false, paused:false }; S.dealErr = ""; renderLayer(); return; }
  if(a === "deal-new-nov"){ S.dealEdit = novemberDeal(); S.dealErr = ""; renderLayer(); toast("A starting point — change the numbers to match your plan, then tap Add deal."); return; }
  if(a === "deal-edit"){ const d = allDeals().find(x => x.key === k); if(!d) return; S.dealEdit = Object.assign({}, d, { isNew:false }); S.dealErr = ""; renderLayer(); return; }
  if(a === "close-deal"){ if(el.dataset.bg && e.target !== el) return; S.dealEdit = null; renderLayer(); return; }
  if(a === "deal-pause"){
    const d = allDeals().find(x => x.key === k); if(!d) return;
    const list = dealsToSave(), i = list.findIndex(x => x.key === k);
    if(d.custom){ if(i >= 0) list[i].paused = !d.paused; }
    else{ if(i >= 0) list[i].paused = !d.paused; else list.push({ key:k, paused:!d.paused }); }
    saveConfig({ deals: list }, d.paused ? "Deal is live again" : "Deal paused — hidden from your website");
    return;
  }
  if(a === "deal-delete"){
    const d = allDeals().find(x => x.key === k); if(!d) return;
    if(!confirm("Delete \"" + d.name + "\"? It disappears from your website.")) return;
    let list = dealsToSave().filter(x => x.key !== k);
    if(d.builtin) list.push({ key:k, deleted:true });
    saveConfig({ deals: list }, "Deal deleted");
    return;
  }
  if(a === "deal-restore"){ e.preventDefault(); saveConfig({ deals: dealsToSave().filter(x => !(x.deleted && !x.custom)) }, "Built-in deals are back"); return; }
  if(a === "deal-save"){
    const d = S.dealEdit; if(!d) return;
    if(!String(d.name || "").trim()){ S.dealErr = "Give the deal a name."; renderLayer(); return; }
    const list = dealsToSave().filter(x => x.key !== d.key);
    if(d.builtin){
      const o = { key:d.key, name:String(d.name).trim(), desc:String(d.desc || "").trim(), paused:!!d.paused };
      if(d.value !== undefined && String(d.value) !== ""){ const v = parseMoney(d.value); if(Number.isNaN(v)){ S.dealErr = "The amount needs to be a number."; renderLayer(); return; } o.value = v; }
      list.push(o);
    }else{
      const v = parseMoney(d.value);
      if(v === null || Number.isNaN(v)){ S.dealErr = "Add the amount (a number)."; renderLayer(); return; }
      if(d.type === "percent" && v > 100){ S.dealErr = "A percent can't be over 100."; renderLayer(); return; }
      const c = parseMoney(d.cost);
      list.push({ key:d.key, custom:true, name:String(d.name).trim(), desc:String(d.desc || "").trim(), type:d.type || "flat", value:v, cost:Number.isNaN(c) || c === null ? 0 : c,
        categories:d.categories || [], start:d.start || "", end:d.end || "", includesKit:!!d.includesKit, oneTime:!!d.oneTime, paused:!!d.paused });
    }
    saveConfig({ deals: list }, d.isNew ? "Deal added — it's on your website in about a minute" : "Deal saved");
    return;
  }

  /* weekly hours */
  if(a === "hr-add"){ e.preventDefault(); const H = hoursState(); H[k].w.push({ start:"18:00", end:"21:00" }); render(); return; }
  if(a === "hr-drop"){ e.preventDefault(); const H = hoursState(); H[k].w.splice(1, 1); render(); return; }
  if(a === "save-hours"){
    const H = hoursState(), out = {}; let bad = null;
    for(let d = 0; d <= 6; d++){
      const h = H[d];
      if(h.mode === "flex") out[d] = "flex";
      else if(h.mode === "closed") out[d] = "closed";
      else{
        const w = h.w.filter(x => x.start && x.end);
        if(!w.length || w.some(x => x.start >= x.end)){ bad = DAY_NAMES[d]; break; }
        out[d] = w;
      }
    }
    if(bad){ toast("Check the hours for " + bad + " — the end has to be after the start."); return; }
    const latest = (document.getElementById("hr-latest") || {}).value || "";
    const ok = await saveConfig({ hours: out, latest: latest }, "Hours saved — live on your website in about a minute");
    if(ok){ S.hoursDraft = null; S.latestDraft = undefined; render(); }
    return;
  }
  if(a === "reset-hours"){
    if(!confirm("Put your weekly hours back to the built-in schedule?")) return;
    const ok = await saveConfig({ hours:{}, latest:"" }, "Back to the built-in hours");
    if(ok){ S.hoursDraft = null; S.latestDraft = undefined; render(); }
    return;
  }
});

// Typing in the new editors (no re-render per keystroke, so the keyboard doesn't close).
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset && t.dataset.pr){ const D = S.priceDraft || (S.priceDraft = {}); (D[t.dataset.pr] || (D[t.dataset.pr] = {}))[t.dataset.f] = t.value; return; }
  if(t.id === "pr-sale"){ S.saleDraft = t.value; return; }
  if(t.id === "hr-latest"){ S.latestDraft = t.value; return; }
  if(S.dealEdit){
    const d = S.dealEdit;
    if(t.id === "de-name") d.name = t.value;
    else if(t.id === "de-desc") d.desc = t.value;
    else if(t.id === "de-value") d.value = t.value;
    else if(t.id === "de-cost") d.cost = t.value;
    else if(t.id === "de-start") d.start = t.value;
    else if(t.id === "de-end") d.end = t.value;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset && t.dataset.rp){ S[t.dataset.rp] = t.dataset.rp === "rpPeriod" ? t.value : (Number(t.value) || 0); redrawReport(); return; }
  if(t.dataset && t.dataset.hr !== undefined && t.dataset.hr !== ""){
    const H = hoursState(), d = t.dataset.hr;
    if(t.dataset.f === "mode"){ H[d].mode = t.value; render(); }
    else{ H[d].w[Number(t.dataset.i)][t.dataset.f] = t.value; }
    return;
  }
  if(t.id === "c-rebook" && S.compose && S.compose.draft){
    const dr = S.compose.draft, sub = document.getElementById("c-subject"), bod = document.getElementById("c-body"), btn = document.getElementById("c-button");
    if(sub && bod && btn){ dr.subject = sub.value; dr.body = bod.value; dr.button = btn.value; }
    const line = "If you'd like to book a new time, you're welcome to use the button below.";
    S.compose.rebook = t.checked;
    if(t.checked){ if(dr.body.indexOf(line) === -1) dr.body = dr.body.replace(/\s+$/, "") + "\n\n" + line; dr.button = "Book a new time"; }
    else{ dr.body = dr.body.replace("\n\n" + line, "").replace(line, ""); dr.button = ""; }
    renderLayer(); return;
  }
  if(t.id === "rb-toggle"){ saveConfig({ rebookEmails: t.checked }, t.checked ? "Rebooking emails are on" : "Rebooking emails are off"); return; }
  if(S.dealEdit){
    const d = S.dealEdit;
    if(t.id === "de-type"){ d.type = t.value; renderLayer(); }
    else if(t.id === "de-kit") d.includesKit = t.checked;
    else if(t.id === "de-once") d.oneTime = t.checked;
    else if(t.id === "de-paused") d.paused = t.checked;
    else if(t.dataset && t.dataset.deCat){ const c = t.dataset.deCat; d.categories = (d.categories || []).filter(x => x !== c); if(t.checked) d.categories.push(c); }
    else if(t.id === "de-value" || t.id === "de-cost"){ if(t.id === "de-value") d.value = t.value; else d.cost = t.value; renderLayer(); }
  }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && S.dealEdit){ S.dealEdit = null; renderLayer(); } });

/* ============== start ============== */
S.key = store.get();
if(S.key){
  const cached = cacheLoad();
  if(cached && cached.bookings){ S.data = cached; S.stale = true; render(); load(true); }   // instant, then refresh behind the scenes
  else load(false);
}else render();
</script>
</body>
</html>
